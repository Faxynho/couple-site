<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg-rpg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C2440" />
      <stop offset="100%" stop-color="#5B3A5E" />
    </linearGradient>
    <radialGradient id="glow-rpg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F6D3DE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#F6D3DE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-rpg)" />
  <circle cx="200" cy="150" r="170" fill="url(#glow-rpg)" />

  <!-- carta lendária central -->
  <g transform="translate(140,80) rotate(-6 60 100)">
    <rect x="0" y="0" width="120" height="170" rx="14" fill="#3A2F52" stroke="#F5C451" stroke-width="3" />
    <rect x="10" y="10" width="100" height="150" rx="8" fill="#453862" />
    <text x="60" y="70" font-size="42" text-anchor="middle">⚔️</text>
    <rect x="24" y="100" width="72" height="8" rx="4" fill="#F5C451" fill-opacity="0.8" />
    <rect x="34" y="116" width="52" height="6" rx="3" fill="#D9CBEF" fill-opacity="0.6" />
  </g>

  <!-- carta rara à esquerda -->
  <g transform="translate(58,140) rotate(-14 45 75)">
    <rect x="0" y="0" width="90" height="128" rx="12" fill="#2E3A55" stroke="#7CB6F0" stroke-width="2.5" />
    <text x="45" y="58" font-size="30" text-anchor="middle">🔮</text>
  </g>

  <!-- carta épica à direita -->
  <g transform="translate(268,130) rotate(12 45 75)">
    <rect x="0" y="0" width="90" height="128" rx="12" fill="#402C55" stroke="#C084FC" stroke-width="2.5" />
    <text x="45" y="58" font-size="30" text-anchor="middle">🏹</text>
  </g>

  <!-- barra de vida decorativa -->
  <rect x="90" y="300" width="220" height="14" rx="7" fill="#1F1A2E" />
  <rect x="90" y="300" width="150" height="14" rx="7" fill="#E8798F" />
  <text x="200" y="345" font-family="Georgia, serif" font-size="20" fill="#F5EFEF" text-anchor="middle" opacity="0.85">Mini RPG: Duelo</text>
</svg>
