  <rect width="400" height="400" fill="url(#bg-quiz)" />

  <g transform="translate(60,60)">
    <rect width="280" height="280" rx="28" fill="#FFFFFF" fill-opacity="0.55" />

    <!-- cartão de pergunta -->
