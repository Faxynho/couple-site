    <rect x="146" y="114" width="80" height="26" rx="13" fill="#EAF1FA" stroke="#8FB0DE" stroke-width="2" />
    <rect x="52" y="148" width="80" height="26" rx="13" fill="#EAF1FA" stroke="#8FB0DE" stroke-width="2" />
