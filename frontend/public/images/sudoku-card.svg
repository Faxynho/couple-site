<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF6EE" />
      <stop offset="100%" stop-color="#DFCBF0" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />

  <g transform="translate(40,40)">
    <rect width="320" height="320" rx="20" fill="#FFFFFF" fill-opacity="0.55" />

    <!-- linhas finas -->
    <g stroke="#B9A9C4" stroke-width="1.5" opacity="0.55">
      <line x1="35.5" y1="0" x2="35.5" y2="320" />
      <line x1="71" y1="0" x2="71" y2="320" />
      <line x1="142" y1="0" x2="142" y2="320" />
      <line x1="177.5" y1="0" x2="177.5" y2="320" />
      <line x1="248" y1="0" x2="248" y2="320" />
      <line x1="283.5" y1="0" x2="283.5" y2="320" />
      <line x1="0" y1="35.5" x2="320" y2="35.5" />
      <line x1="0" y1="71" x2="320" y2="71" />
      <line x1="0" y1="142" x2="320" y2="142" />
      <line x1="0" y1="177.5" x2="320" y2="177.5" />
      <line x1="0" y1="248" x2="320" y2="248" />
      <line x1="0" y1="283.5" x2="320" y2="283.5" />
    </g>

    <!-- linhas grossas dos blocos 3x3 -->
    <g stroke="#7A6C72" stroke-width="3">
      <line x1="0" y1="0" x2="320" y2="0" />
      <line x1="0" y1="106.7" x2="320" y2="106.7" />
      <line x1="0" y1="213.3" x2="320" y2="213.3" />
      <line x1="0" y1="320" x2="320" y2="320" />
      <line x1="0" y1="0" x2="0" y2="320" />
      <line x1="106.7" y1="0" x2="106.7" y2="320" />
      <line x1="213.3" y1="0" x2="213.3" y2="320" />
      <line x1="320" y1="0" x2="320" y2="320" />
    </g>

    <!-- alguns blocos destacados, estilo "preenchido" -->
    <rect x="0" y="0" width="35.5" height="35.5" fill="#F6D3DE" opacity="0.7" />
    <rect x="142" y="71" width="35.5" height="35.5" fill="#C9E0F2" opacity="0.7" />
    <rect x="248" y="177.5" width="35.5" height="35.5" fill="#C7DBC9" opacity="0.7" />
    <rect x="71" y="248" width="35.5" height="35.5" fill="#F1E4D3" opacity="0.7" />
    <rect x="283.5" y="35.5" width="35.5" height="35.5" fill="#DFCBF0" opacity="0.7" />

    <!-- números -->
    <g font-family="Nunito, sans-serif" font-weight="800" font-size="24" fill="#4A3F45" text-anchor="middle">
      <text x="17.75" y="26">5</text>
      <text x="159.75" y="97.5">3</text>
      <text x="88.75" y="168.5">8</text>
      <text x="265.75" y="203">9</text>
      <text x="301.25" y="61">1</text>
      <text x="53.5" y="273">7</text>
      <text x="195.25" y="238.5">4</text>
      <text x="230.75" y="309">2</text>
    </g>
  </g>
</svg>
