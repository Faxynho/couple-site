<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg-colors" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF6EE" />
      <stop offset="100%" stop-color="#F6D3DE" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-colors)" />

  <g transform="translate(60,70)">
    <rect width="280" height="280" rx="28" fill="#FFFFFF" fill-opacity="0.55" />

    <!-- alvo de cor à esquerda -->
    <circle cx="90" cy="130" r="62" fill="#E893AA" />
    <circle cx="90" cy="130" r="62" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7" />

    <!-- setas de "recriar" -->
    <g stroke="#7A6C72" stroke-width="4" stroke-linecap="round" opacity="0.55">
      <path d="M172 110 L208 110" />
      <path d="M198 100 L208 110 L198 120" fill="none" />
    </g>

    <!-- prévia recriada à direita, com sliders -->
    <circle cx="286" cy="130" r="46" fill="#8FB0DE" />
    <circle cx="286" cy="130" r="46" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7" />

    <g transform="translate(228,206)">
      <rect width="116" height="10" rx="5" fill="#DFCBF0" opacity="0.7" />
      <circle cx="70" cy="5" r="9" fill="#FFFFFF" stroke="#D9758F" stroke-width="2.5" />
    </g>
    <g transform="translate(228,228)">
      <rect width="116" height="10" rx="5" fill="#C9E0F2" opacity="0.7" />
      <circle cx="42" cy="5" r="9" fill="#FFFFFF" stroke="#D9758F" stroke-width="2.5" />
    </g>
    <g transform="translate(228,250)">
      <rect width="116" height="10" rx="5" fill="#C7DBC9" opacity="0.7" />
      <circle cx="90" cy="5" r="9" fill="#FFFFFF" stroke="#D9758F" stroke-width="2.5" />
    </g>
  </g>
</svg>
