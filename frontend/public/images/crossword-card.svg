<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg-crossword" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF6EE" />
      <stop offset="100%" stop-color="#DCE9E0" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-crossword)" />

  <g transform="translate(70,70)">
    <rect width="260" height="260" rx="24" fill="#FFFFFF" fill-opacity="0.55" />

    <!-- grade estilizada de palavras cruzadas -->
    <g transform="translate(24,24)">
      <!-- linha 1: bloco vazio, letra, letra, letra, bloco -->
      <rect x="0" y="0" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="40" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#D9758F" stroke-width="2" />
      <rect x="80" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#D9758F" stroke-width="2" />
      <rect x="120" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#D9758F" stroke-width="2" />
      <rect x="160" y="0" width="36" height="36" rx="4" fill="#E7DCCF" />

      <!-- linha 2: cruzamento vertical -->
      <rect x="0" y="40" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="40" y="40" width="36" height="36" rx="4" fill="#FCEEF1" stroke="#D9758F" stroke-width="2.5" />
      <rect x="80" y="40" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="120" y="40" width="36" height="36" rx="4" fill="#FCEEF1" stroke="#D9758F" stroke-width="2.5" />
      <rect x="160" y="40" width="36" height="36" rx="4" fill="#E7DCCF" />

      <!-- linha 3 -->
      <rect x="0" y="80" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#8FB0DE" stroke-width="2" />
      <rect x="40" y="80" width="36" height="36" rx="4" fill="#FCEEF1" stroke="#D9758F" stroke-width="2.5" />
      <rect x="80" y="80" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="120" y="80" width="36" height="36" rx="4" fill="#FCEEF1" stroke="#D9758F" stroke-width="2.5" />
      <rect x="160" y="80" width="36" height="36" rx="4" fill="#E7DCCF" />

      <!-- linha 4 -->
      <rect x="0" y="120" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#8FB0DE" stroke-width="2" />
      <rect x="40" y="120" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="80" y="120" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="120" y="120" width="36" height="36" rx="4" fill="#FCEEF1" stroke="#D9758F" stroke-width="2.5" />
      <rect x="160" y="120" width="36" height="36" rx="4" fill="#E7DCCF" />

      <!-- linha 5 -->
      <rect x="0" y="160" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#8FB0DE" stroke-width="2" />
      <rect x="40" y="160" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="80" y="160" width="36" height="36" rx="4" fill="#E7DCCF" />
      <rect x="120" y="160" width="36" height="36" rx="4" fill="#FCEEF1" stroke="#D9758F" stroke-width="2.5" />
      <rect x="160" y="160" width="36" height="36" rx="4" fill="#E7DCCF" />
    </g>
  </g>
</svg>
